name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  python:
    name: Python tests (3.11)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package with claude + provider extras
        run: pip install -e ".[claude,anthropic,openai,test]"
      - name: Run test suite
        run: python -m pytest tests/ -q
  web:
    name: Web typecheck + build (Node 22)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run lint
      - name: Build
        run: npm run build
