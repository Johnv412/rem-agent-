name: Live Gemini Canary

on:
  workflow_dispatch:
  schedule:
    - cron: "17 7 * * *"   # nightly 07:17 UTC

jobs:
  canary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify secret is configured
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::error::GEMINI_API_KEY secret is not configured — the canary cannot run. Add it in repo Settings -> Secrets."
            exit 1
          fi
      - name: Install package
        run: pip install -e .
      - name: Run live canary (real Gemini, throwaway DB)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/live_canary.py
